name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName "' android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # PR에서는 서명 없이 빌드만 확인합니다.
      - name: Build debug APK (compile check)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check release signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 등 서명 시크릿이 없습니다. 저장소 Settings > Secrets and variables > Actions 에 등록해 주세요."
            exit 1
          fi

      - name: Skip if release already exists
        if: github.event_name != 'pull_request'
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} 릴리스가 이미 있어 건너뜁니다. 새로 배포하려면 build.gradle의 versionCode/versionName을 올려 주세요."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && steps.exists.outputs.skip == 'false'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/delivery-map-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$RUNNER_TEMP/delivery-map-${{ steps.version.outputs.name }}.apk" \
            --title "퀵배달 메이커 ${{ steps.version.outputs.name }}" \
            --notes "Android 앱 ${{ steps.version.outputs.name }} 자동 빌드" \
            --target "${{ github.sha }}"
